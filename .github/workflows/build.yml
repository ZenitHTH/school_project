name: Build Installers

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build Windows Apps
        run: |
          pyinstaller packaging/librarian_management.spec
          pyinstaller packaging/student_management.spec
          pyinstaller packaging/booth_app.spec
        working-directory: ${{ github.workspace }}

      - name: Prepare Windows artifacts
        run: |
          mkdir windows-artifacts
          copy dist\LibrarianManagement.exe windows-artifacts\LibrarianManagement-Windows.exe
          copy dist\StudentManagement.exe windows-artifacts\StudentManagement-Windows.exe
          copy dist\BoothApp.exe windows-artifacts\BoothApp-Windows.exe

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Apps-Windows
          path: windows-artifacts/*
          retention-days: 30

  build-macos:
    name: Build macOS (.app & binary)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build macOS Apps
        run: |
          pyinstaller packaging/librarian_management.spec
          pyinstaller packaging/student_management.spec
          pyinstaller packaging/booth_app.spec
        working-directory: ${{ github.workspace }}

      - name: Package macOS zips
        run: |
          mkdir macos-artifacts
          cd dist
          zip -r ../macos-artifacts/LibrarianManagement-macOS.zip LibrarianManagement.app LibrarianManagement
          zip -r ../macos-artifacts/StudentManagement-macOS.zip StudentManagement.app StudentManagement
          zip -r ../macos-artifacts/BoothApp-macOS.zip BoothApp.app BoothApp
          cd ..

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Apps-macOS
          path: macos-artifacts/*
          retention-days: 30

  build-ubuntu:
    name: Build Linux (Ubuntu)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build Ubuntu binaries
        run: |
          pyinstaller packaging/librarian_management.spec
          pyinstaller packaging/student_management.spec
          pyinstaller packaging/booth_app.spec
        working-directory: ${{ github.workspace }}

      - name: Package Ubuntu tar.gz
        run: |
          mkdir ubuntu-artifacts
          chmod +x dist/LibrarianManagement dist/StudentManagement dist/BoothApp
          tar -czvf ubuntu-artifacts/LibrarianManagement-Linux-Ubuntu.tar.gz -C dist LibrarianManagement
          tar -czvf ubuntu-artifacts/StudentManagement-Linux-Ubuntu.tar.gz -C dist StudentManagement
          tar -czvf ubuntu-artifacts/BoothApp-Linux-Ubuntu.tar.gz -C dist BoothApp

      - name: Upload Ubuntu artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Apps-Linux-Ubuntu
          path: ubuntu-artifacts/*
          retention-days: 30

  build-fedora:
    name: Build Linux (Fedora)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build in Fedora Container
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace fedora:latest bash -c "
            set -e
            dnf install -y python3 python3-pip gcc mesa-libEGL libxkbcommon-x11 tar
            python3 -m pip install --upgrade pip
            pip install pyinstaller
            pip install -r requirements.txt
            pyinstaller packaging/librarian_management.spec
            pyinstaller packaging/student_management.spec
            pyinstaller packaging/booth_app.spec
            mkdir -p fedora-artifacts
            chmod +x dist/LibrarianManagement dist/StudentManagement dist/BoothApp
            tar -czvf fedora-artifacts/LibrarianManagement-Linux-Fedora.tar.gz -C dist LibrarianManagement
            tar -czvf fedora-artifacts/StudentManagement-Linux-Fedora.tar.gz -C dist StudentManagement
            tar -czvf fedora-artifacts/BoothApp-Linux-Fedora.tar.gz -C dist BoothApp
          "

      - name: Upload Fedora artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Apps-Linux-Fedora
          path: fedora-artifacts/*
          retention-days: 30

  publish-release:
    name: Publish to GitHub Releases
    needs: [build-windows, build-macos, build-ubuntu, build-fedora]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: List downloaded artifacts
        run: ls -laR all-artifacts

      - name: Publish or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || 'latest' }}
          name: ${{ github.event_name == 'release' && github.event.release.name || 'Latest Multi-Platform Build' }}
          prerelease: ${{ github.event_name != 'release' }}
          body: |
            Automated multi-platform standalone builds for School Library & Student Management System.

            ### 📚 Librarian Management App (ระบบจัดการห้องสมุด)
            - **Windows**: `LibrarianManagement-Windows.exe`
            - **macOS**: `LibrarianManagement-macOS.zip`
            - **Linux (Ubuntu)**: `LibrarianManagement-Linux-Ubuntu.tar.gz`
            - **Linux (Fedora)**: `LibrarianManagement-Linux-Fedora.tar.gz`

            ### 🎓 Student Management App (ระบบงานทะเบียนนักเรียน)
            - **Windows**: `StudentManagement-Windows.exe`
            - **macOS**: `StudentManagement-macOS.zip`
            - **Linux (Ubuntu)**: `StudentManagement-Linux-Ubuntu.tar.gz`
            - **Linux (Fedora)**: `StudentManagement-Linux-Fedora.tar.gz`

            ### 🤖 Self-Service Booth App (ตู้ยืม-คืนอัตโนมัติ)
            - **Windows**: `BoothApp-Windows.exe`
            - **macOS**: `BoothApp-macOS.zip`
            - **Linux (Ubuntu)**: `BoothApp-Linux-Ubuntu.tar.gz`
            - **Linux (Fedora)**: `BoothApp-Linux-Fedora.tar.gz`
          files: |
            all-artifacts/**/*.*
