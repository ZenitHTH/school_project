name: Build Installers

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build LibrarianManagement.exe
        run: pyinstaller packaging/librarian_management.spec
        working-directory: ${{ github.workspace }}

      - name: Prepare Windows artifact
        run: |
          copy dist\LibrarianManagement.exe LibrarianManagement-Windows.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibrarianManagement-Windows
          path: LibrarianManagement-Windows.exe
          retention-days: 30

  build-macos:
    name: Build macOS (.app & binary)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build macOS app
        run: pyinstaller packaging/librarian_management.spec
        working-directory: ${{ github.workspace }}

      - name: Package macOS zip
        run: |
          cd dist
          zip -r ../LibrarianManagement-macOS.zip LibrarianManagement.app LibrarianManagement
          cd ..

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibrarianManagement-macOS
          path: LibrarianManagement-macOS.zip
          retention-days: 30

  build-ubuntu:
    name: Build Linux (Ubuntu)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build Ubuntu binary
        run: pyinstaller packaging/librarian_management.spec
        working-directory: ${{ github.workspace }}

      - name: Package Ubuntu tar.gz
        run: |
          chmod +x dist/LibrarianManagement
          tar -czvf LibrarianManagement-Linux-Ubuntu.tar.gz -C dist LibrarianManagement

      - name: Upload Ubuntu artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibrarianManagement-Linux-Ubuntu
          path: LibrarianManagement-Linux-Ubuntu.tar.gz
          retention-days: 30

  build-fedora:
    name: Build Linux (Fedora)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build in Fedora Container
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace fedora:latest bash -c "
            set -e
            dnf install -y python3 python3-pip gcc mesa-libEGL libxkbcommon-x11 tar
            python3 -m pip install --upgrade pip
            pip install pyinstaller
            pip install -r requirements.txt
            pyinstaller packaging/librarian_management.spec
            chmod +x dist/LibrarianManagement
            tar -czvf LibrarianManagement-Linux-Fedora.tar.gz -C dist LibrarianManagement
          "

      - name: Upload Fedora artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibrarianManagement-Linux-Fedora
          path: LibrarianManagement-Linux-Fedora.tar.gz
          retention-days: 30

  publish-release:
    name: Publish to GitHub Releases
    needs: [build-windows, build-macos, build-ubuntu, build-fedora]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: List downloaded artifacts
        run: ls -laR all-artifacts

      - name: Publish or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || 'latest' }}
          name: ${{ github.event_name == 'release' && github.event.release.name || 'Latest Multi-Platform Build' }}
          prerelease: ${{ github.event_name != 'release' }}
          body: |
            Automated multi-platform standalone builds for School Library Management.

            ### 📥 Download by Operating System:
            - **Windows**: `LibrarianManagement-Windows.exe` (run directly, no install required)
            - **macOS**: `LibrarianManagement-macOS.zip` (unzip and open `LibrarianManagement.app`)
            - **Linux (Ubuntu / Debian)**: `LibrarianManagement-Linux-Ubuntu.tar.gz`
            - **Linux (Fedora / RHEL)**: `LibrarianManagement-Linux-Fedora.tar.gz`
          files: |
            all-artifacts/LibrarianManagement-Windows/LibrarianManagement-Windows.exe
            all-artifacts/LibrarianManagement-macOS/LibrarianManagement-macOS.zip
            all-artifacts/LibrarianManagement-Linux-Ubuntu/LibrarianManagement-Linux-Ubuntu.tar.gz
            all-artifacts/LibrarianManagement-Linux-Fedora/LibrarianManagement-Linux-Fedora.tar.gz

