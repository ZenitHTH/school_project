name: Build Installers

on:
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install PySide6>=6.5.0 openpyxl>=3.1.0 sqlcipher3-binary

      - name: Build LibrarianManagement.exe
        run: pyinstaller packaging/librarian_management_windows.spec
        working-directory: ${{ github.workspace }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibrarianManagement-Windows
          path: dist/LibrarianManagement.exe
          retention-days: 30

  release-assets:
    name: Attach exe to Release
    needs: build-windows
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LibrarianManagement-Windows

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: LibrarianManagement.exe
