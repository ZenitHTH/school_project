name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: QT_QPA_PLATFORM=offscreen pytest -v

  build-windows:
    name: Build Windows (.exe & Setup.exe)
    needs: [test]
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Set Release Version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="${{ inputs.version || '1.0.0' }}"
          fi
          echo "VERSION=${VER}" >> $GITHUB_ENV

      - name: Build Windows Apps
        run: |
          pyinstaller packaging/librarian_management.spec
          pyinstaller packaging/student_management.spec
          pyinstaller packaging/booth_app.spec
        working-directory: ${{ github.workspace }}

      - name: Build Windows Installers (Inno Setup)
        run: |
          mkdir -Force dist\installers
          iscc /DAppName="LibrarianManagement" /DAppExe="LibrarianManagement.exe" /DAppVersion="${{ env.VERSION }}" /DSourceExe="${{ github.workspace }}\dist\LibrarianManagement.exe" /DOutputDir="${{ github.workspace }}\dist\installers" packaging\installers\windows\installer.iss
          iscc /DAppName="StudentManagement" /DAppExe="StudentManagement.exe" /DAppVersion="${{ env.VERSION }}" /DSourceExe="${{ github.workspace }}\dist\StudentManagement.exe" /DOutputDir="${{ github.workspace }}\dist\installers" packaging\installers\windows\installer.iss
          iscc /DAppName="BoothApp" /DAppExe="BoothApp.exe" /DAppVersion="${{ env.VERSION }}" /DSourceExe="${{ github.workspace }}\dist\BoothApp.exe" /DOutputDir="${{ github.workspace }}\dist\installers" packaging\installers\windows\installer.iss
        working-directory: ${{ github.workspace }}

      - name: Prepare Windows artifacts
        run: |
          mkdir windows-artifacts
          copy dist\LibrarianManagement.exe windows-artifacts\LibrarianManagement-Windows.exe
          copy dist\StudentManagement.exe windows-artifacts\StudentManagement-Windows.exe
          copy dist\BoothApp.exe windows-artifacts\BoothApp-Windows.exe
          copy dist\installers\*.exe windows-artifacts\

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Apps-Windows
          path: windows-artifacts/*
          retention-days: 30

  build-macos:
    name: Build macOS (.app, .zip & .dmg)
    needs: [test]
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Set Release Version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="${{ inputs.version || '1.0.0' }}"
          fi
          echo "VERSION=${VER}" >> $GITHUB_ENV

      - name: Build macOS Apps
        run: |
          pyinstaller packaging/librarian_management.spec
          pyinstaller packaging/student_management.spec
          pyinstaller packaging/booth_app.spec
        working-directory: ${{ github.workspace }}

      - name: Build macOS DMGs
        run: |
          ./packaging/installers/macos/create_dmg.sh LibrarianManagement dist/LibrarianManagement.app "$VERSION" dist/installers
          ./packaging/installers/macos/create_dmg.sh StudentManagement dist/StudentManagement.app "$VERSION" dist/installers
          ./packaging/installers/macos/create_dmg.sh BoothApp dist/BoothApp.app "$VERSION" dist/installers

      - name: Package macOS artifacts
        run: |
          mkdir -p macos-artifacts
          ditto -c -k --sequesterRsrc --keepParent dist/LibrarianManagement.app macos-artifacts/LibrarianManagement-macOS-${VERSION}.zip
          ditto -c -k --sequesterRsrc --keepParent dist/StudentManagement.app macos-artifacts/StudentManagement-macOS-${VERSION}.zip
          ditto -c -k --sequesterRsrc --keepParent dist/BoothApp.app macos-artifacts/BoothApp-macOS-${VERSION}.zip
          cp dist/installers/*.dmg macos-artifacts/

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Apps-macOS
          path: macos-artifacts/*
          retention-days: 30

  build-ubuntu:
    name: Build Linux Ubuntu (.tar.gz & .deb)
    needs: [test]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 binutils dpkg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Set Release Version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="${{ inputs.version || '1.0.0' }}"
          fi
          echo "VERSION=${VER}" >> $GITHUB_ENV

      - name: Build Ubuntu binaries
        run: |
          pyinstaller packaging/librarian_management.spec
          pyinstaller packaging/student_management.spec
          pyinstaller packaging/booth_app.spec
        working-directory: ${{ github.workspace }}

      - name: Build Debian packages (.deb)
        run: |
          ./packaging/installers/deb/build_deb.sh LibrarianManagement LibrarianManagement "$VERSION" dist/LibrarianManagement dist/installers
          ./packaging/installers/deb/build_deb.sh StudentManagement StudentManagement "$VERSION" dist/StudentManagement dist/installers
          ./packaging/installers/deb/build_deb.sh BoothApp BoothApp "$VERSION" dist/BoothApp dist/installers

      - name: Package Ubuntu artifacts
        run: |
          mkdir -p ubuntu-artifacts
          chmod +x dist/LibrarianManagement dist/StudentManagement dist/BoothApp
          tar -czvf ubuntu-artifacts/LibrarianManagement-Linux-Ubuntu.tar.gz -C dist LibrarianManagement
          tar -czvf ubuntu-artifacts/StudentManagement-Linux-Ubuntu.tar.gz -C dist StudentManagement
          tar -czvf ubuntu-artifacts/BoothApp-Linux-Ubuntu.tar.gz -C dist BoothApp
          cp dist/installers/*.deb ubuntu-artifacts/

      - name: Upload Ubuntu artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Apps-Linux-Ubuntu
          path: ubuntu-artifacts/*
          retention-days: 30

  build-fedora:
    name: Build Linux Fedora (.tar.gz & .rpm)
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set Release Version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="${{ inputs.version || '1.0.0' }}"
          fi
          echo "VERSION=${VER}" >> $GITHUB_ENV

      - name: Build and Package in Fedora Container
        run: |
          docker run --rm -e VERSION="${VERSION}" -v "${{ github.workspace }}:/workspace" -w /workspace fedora:latest bash -c "
            set -e
            dnf install -y python3 python3-pip gcc mesa-libEGL libxkbcommon-x11 tar rpm-build
            python3 -m pip install --upgrade pip
            pip install pyinstaller
            pip install -r requirements.txt
            pyinstaller packaging/librarian_management.spec
            pyinstaller packaging/student_management.spec
            pyinstaller packaging/booth_app.spec
            mkdir -p fedora-artifacts
            chmod +x dist/LibrarianManagement dist/StudentManagement dist/BoothApp
            tar -czvf fedora-artifacts/LibrarianManagement-Linux-Fedora.tar.gz -C dist LibrarianManagement
            tar -czvf fedora-artifacts/StudentManagement-Linux-Fedora.tar.gz -C dist StudentManagement
            tar -czvf fedora-artifacts/BoothApp-Linux-Fedora.tar.gz -C dist BoothApp
            
            ./packaging/installers/rpm/build_rpm.sh LibrarianManagement LibrarianManagement \"\$VERSION\" dist/LibrarianManagement dist/installers
            ./packaging/installers/rpm/build_rpm.sh StudentManagement StudentManagement \"\$VERSION\" dist/StudentManagement dist/installers
            ./packaging/installers/rpm/build_rpm.sh BoothApp BoothApp \"\$VERSION\" dist/BoothApp dist/installers
            cp dist/installers/*.rpm fedora-artifacts/
          "

      - name: Upload Fedora artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Apps-Linux-Fedora
          path: fedora-artifacts/*
          retention-days: 30

  publish-release:
    name: Publish to GitHub Releases
    needs: [build-windows, build-macos, build-ubuntu, build-fedora]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find all-artifacts -type f -exec cp {} release-assets/ \;
          cd release-assets
          sha256sum * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Release {0}', github.ref_name) || 'Latest Multi-Platform Build (main)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') || contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: release-assets/*
