name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override release version (defaults to VERSION file)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    name: Run Pytest & Resolve Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve Release Version
        id: meta
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VER="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="$(tr -d '[:space:]' < VERSION)"
          fi
          VER="${VER#v}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: ${VER} (tag: v${VER})"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: QT_QPA_PLATFORM=offscreen pytest -v

  build-windows:
    name: Build Windows Installers (Setup.exe)
    needs: [test]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Sync VERSION file
        shell: bash
        run: echo "${VERSION}" > VERSION

      - name: Build Windows Apps
        run: |
          pyinstaller packaging/librarian_management.spec
          pyinstaller packaging/student_management.spec
          pyinstaller packaging/booth_app.spec
        working-directory: ${{ github.workspace }}

      - name: Build Windows Installers (Inno Setup)
        run: |
          mkdir -Force dist\installers
          iscc /DAppName="LibrarianManagement" /DAppExe="LibrarianManagement.exe" /DAppVersion="${{ env.VERSION }}" /DSourceExe="${{ github.workspace }}\dist\LibrarianManagement.exe" /DOutputDir="${{ github.workspace }}\dist\installers" packaging\installers\windows\installer.iss
          iscc /DAppName="StudentManagement" /DAppExe="StudentManagement.exe" /DAppVersion="${{ env.VERSION }}" /DSourceExe="${{ github.workspace }}\dist\StudentManagement.exe" /DOutputDir="${{ github.workspace }}\dist\installers" packaging\installers\windows\installer.iss
          iscc /DAppName="BoothApp" /DAppExe="BoothApp.exe" /DAppVersion="${{ env.VERSION }}" /DSourceExe="${{ github.workspace }}\dist\BoothApp.exe" /DOutputDir="${{ github.workspace }}\dist\installers" packaging\installers\windows\installer.iss
        working-directory: ${{ github.workspace }}

      - name: Upload Windows Installers
        uses: actions/upload-artifact@v4
        with:
          name: Installers-Windows
          path: dist/installers/*.exe
          retention-days: 14

  build-macos:
    name: Build macOS Installers (.dmg)
    needs: [test]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Sync VERSION file
        run: echo "${VERSION}" > VERSION

      - name: Build macOS Apps
        run: |
          pyinstaller packaging/librarian_management.spec
          pyinstaller packaging/student_management.spec
          pyinstaller packaging/booth_app.spec
        working-directory: ${{ github.workspace }}

      - name: Build macOS DMGs
        run: |
          ./packaging/installers/macos/create_dmg.sh LibrarianManagement dist/LibrarianManagement.app "$VERSION" dist/installers
          ./packaging/installers/macos/create_dmg.sh StudentManagement dist/StudentManagement.app "$VERSION" dist/installers
          ./packaging/installers/macos/create_dmg.sh BoothApp dist/BoothApp.app "$VERSION" dist/installers

      - name: Upload macOS Installers
        uses: actions/upload-artifact@v4
        with:
          name: Installers-macOS
          path: dist/installers/*.dmg
          retention-days: 14

  build-ubuntu:
    name: Build Debian/Ubuntu Packages (.deb)
    needs: [test]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.test.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 binutils dpkg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Sync VERSION file
        run: echo "${VERSION}" > VERSION

      - name: Build Ubuntu Binaries
        run: |
          pyinstaller packaging/librarian_management.spec
          pyinstaller packaging/student_management.spec
          pyinstaller packaging/booth_app.spec
        working-directory: ${{ github.workspace }}

      - name: Build Debian Packages (.deb)
        run: |
          ./packaging/installers/deb/build_deb.sh LibrarianManagement LibrarianManagement "$VERSION" dist/LibrarianManagement dist/installers
          ./packaging/installers/deb/build_deb.sh StudentManagement StudentManagement "$VERSION" dist/StudentManagement dist/installers
          ./packaging/installers/deb/build_deb.sh BoothApp BoothApp "$VERSION" dist/BoothApp dist/installers

      - name: Upload Debian Installers
        uses: actions/upload-artifact@v4
        with:
          name: Installers-Linux-Debian
          path: dist/installers/*.deb
          retention-days: 14

  build-fedora:
    name: Build Fedora/RHEL Packages (.rpm)
    needs: [test]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Sync VERSION file
        run: echo "${VERSION}" > VERSION

      - name: Build and Package in Fedora Container
        run: |
          docker run --rm -e VERSION="${VERSION}" -v "${{ github.workspace }}:/workspace" -w /workspace fedora:latest bash -c "
            set -e
            dnf install -y python3 python3-pip gcc mesa-libEGL libxkbcommon-x11 tar rpm-build
            python3 -m pip install --upgrade pip
            pip install pyinstaller
            pip install -r requirements.txt
            pyinstaller packaging/librarian_management.spec
            pyinstaller packaging/student_management.spec
            pyinstaller packaging/booth_app.spec
            mkdir -p fedora-artifacts
            ./packaging/installers/rpm/build_rpm.sh LibrarianManagement LibrarianManagement \"\$VERSION\" dist/LibrarianManagement fedora-artifacts
            ./packaging/installers/rpm/build_rpm.sh StudentManagement StudentManagement \"\$VERSION\" dist/StudentManagement fedora-artifacts
            ./packaging/installers/rpm/build_rpm.sh BoothApp BoothApp \"\$VERSION\" dist/BoothApp fedora-artifacts
          "

      - name: Upload Fedora Installers
        uses: actions/upload-artifact@v4
        with:
          name: Installers-Linux-Fedora
          path: fedora-artifacts/*.rpm
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: [test, build-windows, build-macos, build-ubuntu, build-fedora]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}
      TAG: ${{ needs.test.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums & Release Notes
        run: |
          cd release-assets
          sha256sum * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cd ..

          DEB_VER="${VERSION//-/~}"
          cat <<EOF > RELEASE_NOTES.md
          ## SMTE School System — Release v${VERSION}

          | Application | Windows (Installer) | macOS (Disk Image) | Ubuntu / Debian | Fedora / RHEL |
          | :--- | :--- | :--- | :--- | :--- |
          | **📚 Librarian Management** | \`LibrarianManagement-Setup-${VERSION}.exe\` | \`LibrarianManagement-${VERSION}.dmg\` | \`librarianmanagement_${DEB_VER}_amd64.deb\` | \`librarianmanagement-${DEB_VER}-1.*.rpm\` |
          | **🎓 Student Management** | \`StudentManagement-Setup-${VERSION}.exe\` | \`StudentManagement-${VERSION}.dmg\` | \`studentmanagement_${DEB_VER}_amd64.deb\` | \`studentmanagement-${DEB_VER}-1.*.rpm\` |
          | **🤖 Self-Service Booth** | \`BoothApp-Setup-${VERSION}.exe\` | \`BoothApp-${VERSION}.dmg\` | \`boothapp_${DEB_VER}_amd64.deb\` | \`boothapp-${DEB_VER}-1.*.rpm\` |

          > **Checksums**: Verify downloaded installers against \`SHA256SUMS.txt\`.
          EOF

      - name: Clean Stale Release & Tag Before Publish
        run: |
          gh release delete "latest" --cleanup-tag -y 2>/dev/null || true
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            gh release delete "${TAG}" --cleanup-tag -y 2>/dev/null || true
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.test.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: SMTE School System v${{ needs.test.outputs.version }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(needs.test.outputs.version, '-') }}
          make_latest: ${{ !contains(needs.test.outputs.version, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
